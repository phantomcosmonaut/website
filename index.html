<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #fff;
        }

        body {
            display: grid;
            place-items: center;
        }

        body.clickable {
            cursor: pointer;
        }

        /* The 16:9 video area, as large as fits the window. Text is positioned inside it,
           and its font sizes use cqw (1% of this box's width) so text scales with the video. */
        #frame {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            aspect-ratio: 16 / 9;
            container-type: inline-size;
        }

        /* Fades the whole sequence in on start and out at the end. */
        #stage {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 300ms ease;
        }

        #stage.shown {
            opacity: 1;
        }

        /* Both videos sit on top of each other; only the .visible one is shown. */
        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        video.visible {
            opacity: 1;
        }

        /* Text box; left/top are set from each screen's (x, y). */
        #caption {
            position: absolute;
            max-width: 34cqw;
            opacity: 0;
            transition: opacity 300ms ease;
            text-shadow: 0 0.1cqw 0.6cqw rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        #caption.shown {
            opacity: 1;
        }

        #caption h1 {
            margin: 0 0 0.8cqw;
            font-size: 3cqw;
            font-weight: 700;
            line-height: 1.1;
        }

        #caption p {
            margin: 0;
            font-size: 1.4cqw;
            line-height: 1.45;
        }

        #caption a {
            display: inline-flex;
            align-items: center;
            gap: 0.6em;
            margin-top: 1.2cqw;
            font-size: 1.2cqw;
            color: #fff;
            text-decoration: none;
        }

        #caption a span {
            text-decoration: underline;
            text-underline-offset: 0.3em;
        }

        #caption a svg {
            width: 1.3em;
            height: 1.3em;
            flex-shrink: 0;
            fill: currentColor;
        }

        #caption a[hidden] {
            display: none;
        }

        /* The caption ignores the mouse so clicks reach the page, except a visible link. */
        #caption.shown a {
            pointer-events: auto;
            cursor: pointer;
        }

        #caption small {
            display: block;
            margin-top: 1.6cqw;
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 0.9cqw;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.65;
        }

        /* Shown in place of the subtext on screens that use a button instead of clicking anywhere. */
        #caption button {
            display: block;
            margin-top: 1.6cqw;
            padding: 0.7em 1.6em;
            font: inherit;
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 0.9cqw;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #fff;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 150ms ease, color 150ms ease;
        }

        #caption button:hover,
        #caption button:focus-visible {
            background: #fff;
            color: #000;
            outline: none;
        }

        #caption small[hidden],
        #caption button[hidden] {
            display: none;
        }

        #caption.shown button {
            pointer-events: auto;
        }

        /* Step indicator: one dot per screen, centered along the bottom of the video. */
        #progress {
            position: absolute;
            left: 50%;
            bottom: 3cqw;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.9cqw;
            pointer-events: none;
        }

        #progress span {
            width: 0.5cqw;
            height: 0.5cqw;
            border-radius: 50%;
            background: #fff;
            opacity: 0.3;
            transition: transform 300ms ease, opacity 300ms ease;
        }

        #progress span.active {
            transform: scale(1.5);
            opacity: 1;
        }

        /* Copyright notice, bottom-right of the video, shown only on the end screen. */
        #copyright {
            position: absolute;
            right: 3cqw;
            bottom: 3cqw;
            transform: translateY(50%);
            /* line up with the center of the dots */
            margin: 0;
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 0.8cqw;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 300ms ease;
            pointer-events: none;
        }

        #copyright.shown {
            opacity: 0.45;
        }
    </style>
</head>

<body>
    <div id="frame">
        <div id="stage">
            <video id="v0" muted playsinline preload="auto"></video>
            <video id="v1" muted playsinline preload="auto"></video>
        </div>

        <div id="caption" aria-live="polite">
            <h1></h1>
            <p></p>
            <a target="_blank" rel="noopener" hidden></a>
            <small></small>
            <button type="button" hidden></button>
        </div>

        <div id="progress" aria-hidden="true"></div>

        <p id="copyright">© 2026 Brennan Bugbee</p>
    </div>

    <script>
        // Size of the rendered video. Text x/y are pixel positions in this space
        // (top-left of the text box), so (0, 0) is the video's top-left corner.
        const VIDEO_WIDTH = 1920;
        const VIDEO_HEIGHT = 1080;

        // Icons a text link can show before its label, picked with `icon: "<name>"`.
        const ICONS = {
            linkedin: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
        };

        // Shown on the black screen before the sequence starts.
        const START_TEXT = {
            x: 700, y: 400,
            header: "Hello!",
            body: "My name is Brennan. Welcome to my site.",
            subtext: "Click to continue",
        };

        // Shown on the black screen after the sequence fades out. Only the button restarts;
        // clicking elsewhere does nothing. (`button` replaces the subtext line.)
        const END_TEXT = {
            x: 650, y: 400,
            header: "Thanks for stopping by",
            body: "That's it for now.",
            link: { label: "LinkedIn", href: "https://www.linkedin.com/in/brennan-bugbee-22029583/", icon: "linkedin" },
            button: "Start over",
        };

        // Each section plays `name` once, then repeats `loopName` (showing `text`) until the next click.
        const SECTIONS = [
            {
                name: "a", loopName: "a-loop",
                text: {
                    x: 160, y: 500,
                    header: "About me",
                    body: "I'm a software engineer interested in the creative possibilities of technology.",
                    subtext: "Click to continue",
                },
            },
            {
                name: "b", loopName: "b-loop",
                text: {
                    x: 1100, y: 500,
                    header: "What I do",
                    body: "I design and build full-stack applications, backend systems, and interactive 3D experiences including games and simple animations.",
                    subtext: "Click to continue",
                },
            },
            {
                name: "c", loopName: "c-loop",
                text: {
                    x: 160, y: 500,
                    header: "Offline",
                    body: "Away from the screen, you'll usually find me skiing or hiking with my dog.",
                    subtext: "Click to continue",
                },
            },
        ];

        // Must match the transition times on #stage and #caption.
        const FADE_MS = 300;

        // Frame rate of the renders; used to start the next clip on the current clip's last frame.
        const FPS = 24;

        // Played once after the last section's loop is clicked; the sequence fades out to the
        // end screen as it finishes.
        const OUTRO = "d";

        const steps = [
            ...SECTIONS.flatMap(s => [
                { src: `videos/${s.name}.mp4`, loop: false },
                { src: `videos/${s.loopName}.mp4`, loop: true, text: s.text },
            ]),
            { src: `videos/${OUTRO}.mp4`, loop: false },
        ];

        const stage = document.getElementById("stage");
        const caption = document.getElementById("caption");
        const players = [document.getElementById("v0"), document.getElementById("v1")];
        let state = "loading";    // "loading" | "idle" | "starting" | "playing" | "ending"
        let current = 0;          // which player is visible
        let step = 0;             // which entry in `steps` is playing

        // ?step=N jumps straight to steps[N] and starts playing without a click, for testing.
        // 0 = a, 1 = a-loop, 2 = b, 3 = b-loop, 4 = c, 5 = c-loop, 6 = d.
        const stepParam = new URLSearchParams(location.search).get("step");
        const START_STEP = stepParam === null ? null
            : Math.min(Math.max(Math.floor(Number(stepParam)) || 0, 0), steps.length - 1);
        let advancing = false;    // a click was accepted; waiting for the loop pass to finish
        let switching = false;    // advance() is starting the next clip
        let atEnd = false;        // showing the end screen, where only the button restarts
        const buffered = {};      // clip path -> in-memory blob URL
        const copyright = document.getElementById("copyright");

        const isLastStep = () => step + 1 >= steps.length;

        // One bar per screen: start, each section, end.
        const progress = document.getElementById("progress");
        const bars = Array.from({ length: SECTIONS.length + 2 }, () =>
            progress.appendChild(document.createElement("span")));

        function setProgress(screen) {
            bars.forEach((bar, i) => bar.classList.toggle("active", i === screen));
        }

        function showCaption(t) {
            caption.style.left = `${t.x / VIDEO_WIDTH * 100}%`;
            caption.style.top = `${t.y / VIDEO_HEIGHT * 100}%`;
            caption.querySelector("h1").textContent = t.header;
            caption.querySelector("p").textContent = t.body;
            const link = caption.querySelector("a");
            link.hidden = !t.link;                    // `link` is optional: { label, href, icon? }
            if (t.link) {
                const label = document.createElement("span");
                label.textContent = t.link.label;
                link.innerHTML = ICONS[t.link.icon] || "";
                link.append(label);
                link.href = t.link.href;
            }
            const subtext = caption.querySelector("small");
            const button = caption.querySelector("button");
            subtext.hidden = !!t.button;
            button.hidden = !t.button;
            subtext.textContent = t.subtext || "";
            button.textContent = t.button || "";
            caption.classList.add("shown");
        }

        function hideCaption() {
            caption.classList.remove("shown");
        }

        function load(player, s) {
            player.src = buffered[s.src] || s.src;
            player.loop = s.loop;
            player.load();
        }

        // Download every clip into memory up front, so playback never waits on the network.
        async function bufferAll(onProgress) {
            // Browsers block fetch() on pages opened straight from disk (file://) and log a CORS
            // error. Clips load from disk quickly anyway, so skip buffering there.
            if (location.protocol === "file:") return;

            const srcs = [...new Set(steps.map(s => s.src))];
            const responses = await Promise.all(srcs.map(src => fetch(src)));
            const total = responses.reduce((sum, r) => sum + Number(r.headers.get("Content-Length") || 0), 0);
            let received = 0;

            await Promise.all(responses.map(async (res, i) => {
                if (!res.ok) throw new Error(`${srcs[i]}: ${res.status}`);
                const reader = res.body.getReader();
                const chunks = [];
                for (; ;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    if (total) onProgress(received / total);
                }
                buffered[srcs[i]] = URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
            }));
        }

        // Resolves once `video` has a frame on screen (or after 100ms, as a fallback).
        function firstFrame(video) {
            return new Promise(resolve => {
                if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(() => resolve());
                setTimeout(resolve, 100);
            });
        }

        // Load the clip to start from (and the one after it) so the next start is instant.
        function reset(from = 0) {
            players.forEach(p => {
                p.pause();
                p.classList.remove("visible");
            });
            current = 0;
            step = from;
            advancing = false;
            load(players[0], steps[from]);
            if (!isLastStep()) load(players[1], steps[from + 1]);
            players[0].classList.add("visible");
        }

        function updateCursor() {
            let clickable = false;
            if (state === "idle") {
                clickable = !atEnd;
            } else if (state === "playing") {
                clickable = steps[step].loop && !advancing;
            }
            document.body.classList.toggle("clickable", clickable);
        }

        async function start() {
            state = "starting";
            atEnd = false;
            hideCaption();
            copyright.classList.remove("shown");
            setProgress(Math.floor(step / 2) + 1);    // this section's dot
            updateCursor();
            await players[current].play();
            stage.classList.add("shown");
            state = "playing";
            if (steps[step].loop) showCaption(steps[step].text);   // only when started on a loop via ?step
            updateCursor();
        }

        function end() {
            if (state === "ending") return;
            state = "ending";
            hideCaption();
            setProgress(bars.length - 1);
            updateCursor();
            stage.classList.remove("shown");
            setTimeout(() => {
                reset();
                state = "idle";
                atEnd = true;
                showCaption(END_TEXT);
                copyright.classList.add("shown");
                updateCursor();
            }, FADE_MS);
        }

        async function advance() {
            if (switching || isLastStep()) return;
            switching = true;
            step++;
            advancing = false;

            const next = players[1 - current];
            const shown = firstFrame(next);
            await next.play();                        // already preloaded, so it starts at once
            await shown;
            next.classList.add("visible");            // swap only once its first frame is ready
            players[current].classList.remove("visible");
            players[current].pause();
            current = 1 - current;

            if (steps[step].loop) showCaption(steps[step].text);

            // Preload the step after this one into the now-hidden player.
            if (!isLastStep()) load(players[1 - current], steps[step + 1]);
            switching = false;
            updateCursor();
        }

        // A play-once clip finished: start the next one, or fade out to the end screen after the outro.
        function clipFinished() {
            if (isLastStep()) end();
            else advance();
        }

        // Start the next clip as soon as a non-looping clip shows its last frame, rather than
        // waiting for "ended", which arrives a frame or two later and leaves a visible pause.
        players.forEach(p => {
            if (!p.requestVideoFrameCallback) return;
            const onFrame = (now, frame) => {
                const lastFrame = frame.mediaTime >= p.duration - 1.5 / FPS;
                if (state === "playing" && p === players[current] && !p.loop && lastFrame) clipFinished();
                p.requestVideoFrameCallback(onFrame);
            };
            p.requestVideoFrameCallback(onFrame);
        });

        // Fallback for browsers without requestVideoFrameCallback.
        players.forEach(p => p.addEventListener("ended", () => {
            if (state === "playing" && p === players[current]) clipFinished();
        }));

        // The end screen's "Start over" button.
        caption.querySelector("button").addEventListener("click", () => {
            if (state === "idle") start();
        });

        document.addEventListener("click", e => {
            if (e.target.closest("a, button")) return;   // links and buttons handle their own clicks
            if (state === "idle" && atEnd) return;    // end screen: only the button restarts
            if (state === "idle") return start();
            if (state !== "playing") return;          // ignore clicks while starting or fading out

            const s = steps[step];
            // Ignore clicks during play-once clips and after a click was already accepted.
            if (!s.loop || advancing) return;

            if (isLastStep()) return end();           // final loop: fade out, then wait for a restart

            advancing = true;
            hideCaption();
            setProgress(Math.floor(step / 2) + 2);    // the next section's bar
            players[current].loop = false;            // finish this pass, then "ended" advances
            updateCursor();
        });

        // Show the start text with a loading percentage, then allow clicking once every clip is in memory.
        showCaption({ ...START_TEXT, subtext: "Loading…" });
        setProgress(0);
        updateCursor();
        bufferAll(fraction => {
            caption.querySelector("small").textContent = `Loading… ${Math.round(fraction * 100)}%`;
        })
            .catch(err => console.warn("Couldn't buffer clips; streaming them instead.", err))
            .finally(() => {
                reset(START_STEP ?? 0);
                state = "idle";
                caption.querySelector("small").textContent = START_TEXT.subtext;
                updateCursor();
                if (START_STEP !== null) start();     // muted video may autoplay without a click
            });
    </script>
</body>

</html>
